version: 1
interface:
  display_name: Gerador de Pecas por Acervo
  short_description: Organiza acervo e gera pecas.
  default_prompt: Ao primeiro uso, crie automaticamente o acervo_pecas no workspace do usuario, preferindo bootstrap em PowerShell no Windows e usando Python apenas quando necessario. Depois, use o acervo local do usuario para catalogar pecas, extrair padroes de redacao e redigir novas pecas ou analises em portugues juridico brasileiro formal.
